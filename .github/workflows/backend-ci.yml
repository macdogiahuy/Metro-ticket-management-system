name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metro_be02a_test_ci
          POSTGRES_USER: metro_user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metro_user -d metro_be02a_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore Metro.sln
      - name: Build
        working-directory: backend
        run: dotnet build Metro.sln --configuration Release --no-restore
      - name: Deploy test database schema
        run: psql -v ON_ERROR_STOP=1 -f infra/database/deploy.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: metro_be02a_test_ci
          PGUSER: metro_user
          PGPASSWORD: postgres
      - name: Test
        working-directory: backend
        run: dotnet test Metro.sln --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=metro_be02a_test_ci;Username=metro_user;Password=postgres
          METRO_TEST_CONNECTION: Host=localhost;Port=5432;Database=metro_be02a_test_ci;Username=metro_user;Password=postgres
          METRO_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=metro_be02a_test_ci;Username=metro_user;Password=postgres
          METRO_TEST_POSTGRES_DATABASE: metro_be02a_test_ci
          METRO_TEST_POSTGRES_REQUIRED: '1'
