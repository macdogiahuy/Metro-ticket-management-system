name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore Metro.sln
      - name: Build
        working-directory: backend
        run: dotnet build Metro.sln --configuration Release --no-restore
      - name: Test against disposable PostgreSQL
        shell: pwsh
        working-directory: backend
        run: ./tests/Run-PostgresMappingTests.ps1 -NoBuild -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'backend-test-results')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-test-results/*.trx
          if-no-files-found: warn
